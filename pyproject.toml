[project]
name = "music-ticket-scam-checker"
version = "3.0.0.dev1"
description = "Checks screenshots of music ticket listings for scam warning signs (v3)."
requires-python = ">=3.10"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q -m 'not slow'"
markers = ["slow: uses the real OCR model (run with: pytest -m slow)"]

[tool.ruff]
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "B"]
